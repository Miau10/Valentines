<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Emilia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }
        
        body {
            background-color: #ffcce6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden; /* Evita scrolls raros al mover el botón */
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
            z-index: 10;
            border: 8px solid #ff66b2;
        }
        
        h1 { color: #ff3399; font-size: 2.2rem; margin-bottom: 20px; }
        
        .question { color: #cc0066; font-size: 1.6rem; margin-bottom: 30px; }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        
        .btn-yes { background-color: #4CAF50; color: white; }
        
        .btn-no { 
            background-color: #ff3333; 
            color: white; 
            position: relative; 
            z-index: 9999;
        }
        
        #response {
            display: none;
            margin-top: 20px;
        }

        .heart {
            position: fixed;
            top: -10%;
            color: rgba(255, 102, 178, 0.6);
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>I love you so much Emilia</h1>
        <div class="question" id="mainQuestion">Will you be my valentine?</div>
        
        <div class="buttons-container" id="btns">
            <button class="btn btn-yes" id="yesBtn">YES</button>
            <button class="btn btn-no" id="noBtn">NO</button>
        </div>
        
        <div id="response">
            <div style="font-size: 4rem;">😊</div>
            <h2 style="color: #ff3399;">Opaaaaa!</h2>
            <p style="font-size: 1.2rem; color: #cc0066;">U will not regret MY LOVE. See u at HAM airport!</p>
        </div>
    </div>

    <script>

        const responseDiv = document.getElementById('response');
        const questionText = document.getElementById('mainQuestion');
        const btnsDiv = document.getElementById('btns');

            heart.style.left = Math.random() * 100 + 'vw';

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        });
