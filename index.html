<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Emilia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #ffcce6;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: white;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
            z-index: 1000; /* Asegura que esté por encima de los corazones */
            position: relative;
            text-align: center;
        }

        h1 { color: #ff3399; font-size: 22px; margin-bottom: 15px; }
        p { color: #cc0066; font-size: 18px; margin-bottom: 25px; }

        .btns {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #yesBtn { background-color: #4CAF50; color: white; min-width: 100px; }
        #noBtn { background-color: #ff3333; color: white; min-width: 100px; }

        #response { display: none; }

        /* Corazones al fondo absoluto e ignoran clics */
        .heart {
            position: fixed;
            top: -10%;
            color: #ff66b2;
            z-index: -1; 
            pointer-events: none; 
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="content">
            <h1>I love you so much Emilia</h1>
            <p>Will you be my valentine?</p>
            <div class="btns">
                <button id="yesBtn">YES</button>
                <button id="noBtn">NO</button>
            </div>
        </div>
        
        <div id="response">
            <h1 style="font-size: 60px; margin-bottom: 10px;">😊</h1>
            <h2 style="color: #ff3399;">¡Opaaaaa!</h2>
            <p>U will not regret MY LOVE.<br>See u at HAM airport!</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const response = document.getElementById('response');
        const content = document.getElementById('content');

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        setInterval(createHeart, 400);

        // Usamos tochend para iPhone que es más rápido que click
        const handleYes = (e) => {
            e.preventDefault();
            content.style.display = 'none';
            response.style.display = 'block';
            for(let i=0; i<40; i++) setTimeout(createHeart, i*50);
        };

        const handleNo = (e) => {
            e.preventDefault();
            
            // Crecer SI
            const currentSize = parseInt(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize + 7) + 'px';
            yesBtn.style.padding = (currentSize * 0.9) + 'px';

            // Cambiar texto NO
            const phrases = ["¿Segura?", "Nooo", "Piénsalo", "YES coño"];
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];

            // Mover NO a cualquier parte de la pantalla
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '2000';
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        };

        // Escuchar tanto clics como toques
        yesBtn.addEventListener('click', handleYes);
        yesBtn.addEventListener('touchstart', handleYes);

        noBtn.addEventListener('click', handleNo);
        noBtn.addEventListener('touchstart', handleNo);
    </script>
</body>
</html>
