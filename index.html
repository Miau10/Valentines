<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Emilia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', sans-serif;
        }
        
        body {
            background-color: #ffcce6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            touch-action: manipulation; /* Optimiza toques en móvil */
        }
        
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 100; /* Asegura que el cuadro esté arriba */
        }
        
        h1 { color: #ff3399; font-size: 24px; margin-bottom: 10px; }
        p { color: #cc0066; margin-bottom: 20px; }
        
        .btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }
        
        button {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            z-index: 200; /* Botones siempre clickeables */
        }
        
        #yesBtn { background-color: #4CAF50; color: white; }
        #noBtn { background-color: #ff3333; color: white; }
        
        #response { display: none; }
        
        .heart {
            position: fixed;
            top: -10%;
            color: #ff66b2;
            z-index: 1; /* Corazones al fondo */
            pointer-events: none; /* ESTO ES CLAVE: Ignora los clics */
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

        </div>

            <p>U will not regret MY LOVE.<br>See u at HAM airport!</p>
        </div>
    </div>

        }
