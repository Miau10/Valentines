<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Emilia</title>
    <style>
        body {
            background-color: #ffcce6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #ff3399; font-size: 24px; }
        .btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        #yesBtn { background-color: #4CAF50; color: white; }
        #noBtn { background-color: #ff3333; color: white; z-index: 1000; }
        #response { display: none; margin-top: 20px; }
        .heart {
            position: fixed;
            top: -10%;
            color: #ff66b2;
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall 4s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="content">
            <h1>I love you so much Emilia</h1>
            <p>Will you be my valentine?</p>
            <div class="btns">
                <button id="yesBtn">YES</button>
                <button id="noBtn">NO</button>
            </div>
        </div>
        
        <div id="response">
            <h1 style="font-size: 50px;">😊</h1>
            <h2>Opaaaaa!</h2>
            <p>U will not regret MY LOVE. See u at HAM airport!</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const response = document.getElementById('response');
        const content = document.getElementById('content');

        // Función para los corazones
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        setInterval(createHeart, 300);

        // Click en SÍ
        yesBtn.addEventListener('click', () => {
            content.style.display = 'none';
            response.style.display = 'block';
            for(let i=0; i<30; i++) setTimeout(createHeart, i*50);
        });

        // Click en NO
        noBtn.addEventListener('click', () => {
